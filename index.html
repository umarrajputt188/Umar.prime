
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Prime | Login & Sign Up</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#020617,#0b1e48);
  color:#fff;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px
}
.container{
  width:100%;max-width:430px;padding:30px;
  background:#0b1730;border:1px solid #1e40af;
  border-radius:20px;box-shadow:0 15px 50px #0008
}
.logo{text-align:center;font-size:30px;font-weight:bold;margin-bottom:8px}
.logo span{color:#38bdf8}
.subtitle{text-align:center;color:#a9b8d4;margin-bottom:25px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tabs button{
  flex:1;padding:12px;border:1px solid #334155;
  background:#111f3b;color:#fff;border-radius:9px;cursor:pointer
}
.tabs button.active{background:#2563eb;border-color:#2563eb}
h2{margin-bottom:8px}
.description{color:#a9b8d4;margin-bottom:20px;font-size:14px}
input{
  display:block;width:100%;padding:14px;margin-bottom:14px;
  border:1px solid #334b72;border-radius:9px;
  background:#071126;color:white;font-size:15px;outline:none
}
input:focus{border-color:#38bdf8}
.main-btn{
  width:100%;padding:14px;background:#2563eb;color:white;
  border:0;border-radius:9px;font-size:16px;font-weight:bold;
  cursor:pointer;margin-top:4px
}
.main-btn:disabled{opacity:.6;cursor:wait}
.links{text-align:center;margin-top:18px;font-size:14px;color:#b9c6dc}
a{color:#38bdf8;cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
#message{
  display:none;margin:15px 0;padding:12px;border-radius:8px;
  font-size:14px;overflow-wrap:anywhere
}
#dashboard{text-align:center}
#dashboard p{margin:15px 0;color:#bdc9df}
.footer{text-align:center;color:#7185a8;font-size:12px;margin-top:25px}
</style>
</head>

<body>
<div class="container">
  <div class="logo">UM <span>Zero Prime</span></div>
  <div class="subtitle">Your ideas. Our platform.</div>

  <div id="authArea">
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Sign Up</button>
    </div>

    <h2 id="formTitle">Welcome Back!</h2>
    <p class="description" id="formDescription">
      Login to your account
    </p>

    <form id="authForm">
      <input id="name" type="text" placeholder="Full Name"
             autocomplete="name" hidden>

      <input id="email" type="email" placeholder="Email Address"
             autocomplete="email" required>

      <input id="password" type="password" placeholder="Password"
             autocomplete="current-password" minlength="6" required>

      <div id="confirmWrap" hidden>
        <input id="confirmPassword" type="password"
               placeholder="Confirm Password"
               autocomplete="new-password" minlength="6">
      </div>

      <div id="forgotRow" style="text-align:right;margin-bottom:18px">
        <a id="forgotLink" href="#">Forgot Password?</a>
      </div>

      <button id="submitBtn" class="main-btn" type="submit">
        Login
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links" id="switchText">
      Don't have an account? <a id="switchLink" href="#">Sign Up</a>
    </div>
  </div>

  <div id="dashboard" hidden>
    <h2>Welcome to Zero Prime!</h2>
    <p id="userEmail"></p>
    <p>Your account is signed in successfully.</p>
    <button id="logoutBtn" class="main-btn" type="button">
      Logout
    </button>
  </div>

  <div class="footer">© 2026 Zero Prime. All rights reserved.</div>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

/* STEP 1: Replace this with your Firebase Web App config */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

/* STEP 2: Connect Firebase */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let mode = "login";
let busy = false;

function showMessage(text, success = false) {
  $("message").textContent = text;
  $("message").style.display = "block";
  $("message").style.color = success ? "#86efac" : "#fca5a5";
  $("message").style.background = success ? "#123526" : "#401c2a";
}

function clearMessage() {
  $("message").style.display = "none";
  $("message").textContent = "";
}

function setMode(nextMode) {
  mode = nextMode;
  clearMessage();

  const signup = mode === "signup";
  $("loginTab").classList.toggle("active", !signup);
  $("signupTab").classList.toggle("active", signup);

  $("name").hidden = !signup;
  $("name").required = signup;
  $("confirmWrap").hidden = !signup;
  $("confirmPassword").required = signup;
  $("forgotRow").hidden = signup;

  $("formTitle").textContent = signup
    ? "Create Your Account" : "Welcome Back!";
  $("formDescription").textContent = signup
    ? "Sign up for your Zero Prime account"
    : "Login to your account";
  $("submitBtn").textContent = signup ? "Create Account" : "Login";
  $("password").autocomplete = signup ? "new-password" : "current-password";
  $("switchText").innerHTML = signup
    ? 'Already have an account? <a id="switchLink" href="#">Login</a>'
    : 'Don\'t have an account? <a id="switchLink" href="#">Sign Up</a>';

  $("switchLink").addEventListener("click", switchMode);
}

function switchMode(event) {
  event.preventDefault();
  setMode(mode === "login" ? "signup" : "login");
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));
$("switchLink").addEventListener("click", switchMode);

$("forgotLink").addEventListener("click", async event => {
  event.preventDefault();
  clearMessage();

  const email = $("email").value.trim();
  if (!email) {
    showMessage("Enter your email address first.");
    $("email").focus();
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("If the account exists, a password reset email has been sent.", true);
  } catch (error) {
    showMessage("Could not send reset email. Check your email and Firebase settings.");
    console.error(error);
  }
});

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;

  clearMessage();
  const email = $("email").value.trim();
  const password = $("password").value;

  if (mode === "signup" &&
      password !== $("confirmPassword").value) {
    showMessage("Passwords do not match.");
    return;
  }

  busy = true;
  $("submitBtn").disabled = true;

  try {
    if (mode === "signup") {
      const name = $("name").value.trim();
      const credential = await createUserWithEmailAndPassword(
        auth, email, password
      );
      await updateProfile(credential.user, { displayName: name });
      showMessage("Account created successfully!", true);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      showMessage("Login successful!", true);
    }
  } catch (error) {
    const messages = {
      "auth/email-already-in-use": "This email is already registered.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Choose a stronger password.",
      "auth/invalid-credential": "Email or password is incorrect.",
      "auth/network-request-failed": "Network error. Check your internet."
    };
    showMessage(messages[error.code] ||
      "Authentication failed. Check Firebase setup and try again.");
    console.error("Firebase Auth error:", error.code, error.message);
  } finally {
    busy = false;
    $("submitBtn").disabled = false;
  }
});

onAuthStateChanged(auth, user => {
  if (user) {
    $("authArea").hidden = true;
    $("dashboard").hidden = false;
    $("userEmail").textContent = user.email || "";
  } else {
    $("authArea").hidden = false;
    $("dashboard").hidden = true;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    setMode("login");
  } catch (error) {
    showMessage("Could not log out. Please try again.");
    console.error(error);
  }
});
</script>
</body>
</html>
https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
